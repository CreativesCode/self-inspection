# ===========================================
# CONFIGURACIÓN: FRONTEND + GRAPHQL + ADMIN
# ===========================================

# Frontend público (sitio web)
server {
    listen 443 ssl;
    server_name www.safe.360ingeco.com;

    ssl_certificate /etc/ssl/certs/www.safe.360ingeco.com.crt;
    ssl_certificate_key /etc/ssl/private/www.safe.360ingeco.com.key;

    location / {
        proxy_pass http://frontend:3000;  # Redirigir tráfico al contenedor del frontend (Next.js)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # GraphQL endpoint
    location /graphql/ {
        proxy_pass http://backend:8000/graphql/;  # Redirigir llamadas GraphQL al backend interno
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://backend:8000/admin/;  # Redirigir llamadas Admin al backend interno
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health/ {
        proxy_pass http://backend:8000/;  # Redirigir health check al backend interno
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirección HTTP a HTTPS para el frontend
server {
    listen 80;
    server_name www.safe.360ingeco.com;
    return 301 https://$host$request_uri;
}

# Redirección de safe.360ingeco.com a www.safe.360ingeco.com
server {
    listen 80;
    listen 443 ssl;
    server_name safe.360ingeco.com;
    
    if ($scheme = https) {
        return 301 https://www.safe.360ingeco.com$request_uri;
    }
    
    return 301 http://www.safe.360ingeco.com$request_uri;
}

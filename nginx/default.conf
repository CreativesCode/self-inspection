# ===========================================
# CONFIGURACIÓN: FRONTEND + GRAPHQL + ADMIN
# ===========================================
# Configurado para trabajar con Application Load Balancer
# El ALB maneja HTTPS, Nginx solo HTTP

# Frontend público (sitio web)
server {
    listen 80;
    server_name www.safe.360ingeco.com safe.360ingeco.com;

    # Health check para el ALB
    location /health/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;  # Redirigir tráfico al contenedor del frontend (Next.js)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GraphQL endpoint
    location /graphql/ {
        proxy_pass http://backend:8000/graphql/;  # Redirigir llamadas GraphQL al backend interno
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://backend:8000/admin/;  # Redirigir llamadas Admin al backend interno
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

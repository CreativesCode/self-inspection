# ===========================================
# CONFIGURACIÓN: FRONTEND + GRAPHQL + ADMIN
# ===========================================
# Configurado para trabajar con Application Load Balancer
# El ALB maneja HTTPS, Nginx solo HTTP

# Frontend público (sitio web)
server {
    listen 80;
    server_name www.safe.360ingeco.com safe.360ingeco.com localhost;

    # Health check para el ALB - CORREGIDO
    location /health/ {
        proxy_pass http://backend:8000/health/;  # FORZAR ruta completa
        proxy_set_header Host backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # GraphQL endpoint
    location /graphql/ {
        proxy_pass http://backend:8000/graphql/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Frontend (catch-all) - CORREGIDO
    location / {
        proxy_pass http://frontend:3000/;  # ← Agregado / al final
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
name: Deploy to S3
on:
  push:
    branches: [main] # Cambia a 'master' si tu rama principal se llama master
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build for production
        run: npm run build:s3
        env:
          # Variables de entorno para el build
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_IMAGES_URL: ${{ secrets.NEXT_PUBLIC_IMAGES_URL }}
          NEXT_PUBLIC_ENVIRONMENT: production

      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Cambia por tu región si es diferente

      - name: 📤 Deploy to S3
        run: |
          aws s3 sync ./out s3://safe.360ingeco.com --delete --cache-control "public, max-age=31536000, immutable" --exclude "*.html" --exclude "*.json"
          aws s3 sync ./out s3://safe.360ingeco.com --delete --cache-control "public, max-age=0, must-revalidate" --include "*.html" --include "*.json"

      - name: 🔄 Invalidate CloudFront (opcional)
        run: |
          if [ ! -z "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
            echo "✅ CloudFront cache invalidated"
          else
            echo "⚠️ CloudFront distribution ID not set, skipping cache invalidation"
          fi

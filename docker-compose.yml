services:
  # Backend Django
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Allow external access for development
      DJANGO_ALLOWED_HOSTS: "*"

  # Frontend SPA con Nginx
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      # API URL for external access (browser)
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      # Internal API URL for Docker network
      NEXT_PUBLIC_INTERNAL_API_URL: "http://backend:8000"

  # Redis (solo interno)
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Celery Worker
  celery:
    build:
      context: ./backend
    command: celery -A backend_self_inspection worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - backend
      - redis

  # Celery Beat
  celery-beat:
    build:
      context: ./backend
    command: celery -A backend_self_inspection beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - backend
      - redis

volumes:
  redis_data:

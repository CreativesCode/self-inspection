version: "3.8"

services:
  # Backend (Django API) - SOLO ACCESO INTERNO
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    expose:
      - "8000" # Solo interno
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}

  # Frontend (Next.js SPA)
  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
    expose:
      - "3000" # Solo interno
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend

  # Nginx - Proxy reverso público
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/certs:/etc/ssl/certs:ro
      - ./ssl/private:/etc/ssl/private:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    environment:
      - FRONTEND_URL=http://frontend:3000

  # Redis (cache y broker de Celery)
  redis:
    image: redis:7-alpine
    expose:
      - "6379" # Solo interno
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Celery Worker
  celery:
    build:
      context: ./backend
    command: celery -A backend_self_inspection worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - backend
      - redis

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./backend
    command: celery -A backend_self_inspection beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - backend
      - redis

volumes:
  redis_data:

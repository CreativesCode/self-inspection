services:
  # Backend Django
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Allow external access for development
      DJANGO_ALLOWED_HOSTS: "*"
      # Enable production Celery configuration
      ENVIRONMENT: "production"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # Enable S3 storage
      USE_S3: "True"
      AWS_ACCESS_KEY_ID: "AKIAW3N4EDP2NOWTSBMChere"
      AWS_SECRET_ACCESS_KEY: "ZQlmymxJJfTadh7kxsQjDYxzJcBkpCdBkNYdOTFU"
      AWS_STORAGE_BUCKET_NAME: "backend-self-inspection-images"
      AWS_S3_REGION_NAME: "eu-south-2"
      AWS_LOCATION: "static"

  # Frontend SPA served with Node.js
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      # API URL for external access (AWS Load Balancer with /backend/ prefix)
      NEXT_PUBLIC_API_URL: "https://www.safe.360ingeco.com/backend"
      NEXT_PUBLIC_GRAPHQL_URL: "https://www.safe.360ingeco.com/backend/graphql/"
      NEXT_PUBLIC_ADMIN_URL: "https://www.safe.360ingeco.com/backend/admin/"
      # Internal API URL for Docker network
      NEXT_PUBLIC_INTERNAL_API_URL: "http://backend:8000"
      NEXT_PUBLIC_INTERNAL_GRAPHQL_URL: "http://backend:8000/graphql/"
      NEXT_PUBLIC_INTERNAL_ADMIN_URL: "http://backend:8000/admin/"
      # Node environment
      NODE_ENV: "production"

  # Redis (solo interno)
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Celery Worker
  celery:
    build:
      context: ./backend
    command: celery -A backend_self_inspection worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Enable production Celery configuration
      ENVIRONMENT: "production"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # Enable S3 storage
      USE_S3: "True"
      AWS_ACCESS_KEY_ID: "AKIAW3N4EDP2NOWTSBMChere"
      AWS_SECRET_ACCESS_KEY: "ZQlmymxJJfTadh7kxsQjDYxzJcBkpCdBkNYdOTFU"
      AWS_STORAGE_BUCKET_NAME: "backend-self-inspection-images"
      AWS_S3_REGION_NAME: "eu-south-2"
      AWS_LOCATION: "static"
    depends_on:
      - backend
      - redis

  # Celery Beat
  celery-beat:
    build:
      context: ./backend
    command: celery -A backend_self_inspection beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Enable production Celery configuration
      ENVIRONMENT: "production"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # Enable S3 storage
      USE_S3: "True"
      AWS_ACCESS_KEY_ID: "AKIAW3N4EDP2NOWTSBMChere"
      AWS_SECRET_ACCESS_KEY: "ZQlmymxJJfTadh7kxsQjDYxzJcBkpCdBkNYdOTFU"
      AWS_STORAGE_BUCKET_NAME: "backend-self-inspection-images"
      AWS_S3_REGION_NAME: "eu-south-2"
      AWS_LOCATION: "static"
    depends_on:
      - backend
      - redis

volumes:
  redis_data:

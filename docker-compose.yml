version: "3.8"

services:
  # Backend (Django API)
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    expose:
      - "8000" # Puerto expuesto dentro del contenedor
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=your_db_user
      - DB_PASSWORD=your_db_password
      - DB_NAME=your_db_name
    depends_on:
      - database

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000" # Puerto expuesto en el host
    environment:
      - API_URL=http://backend:8000 # URL del backend (interno, no público)
    depends_on:
      - backend

  # Nginx (Proxy Reverso)
  nginx:
    build:
      context: ./nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "443:443" # Puerto HTTPS
    depends_on:
      - backend
      - frontend
    environment:
      - API_URL=http://backend:8000
      - FRONTEND_URL=http://frontend:3000

  # Base de datos (PostgreSQL)
  database:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: your_db_name
      POSTGRES_USER: your_db_user
      POSTGRES_PASSWORD: your_db_password
    expose:
      - "5432" # Puerto interno de la base de datos

volumes:
  postgres_data:
